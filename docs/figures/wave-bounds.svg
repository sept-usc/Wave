<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc"><title id="title">Wave: what the bound search asks</title><desc id="desc">Illustrative feasible parameter range from 80 to 120 in arbitrary units, not measured results or an actual solver trace. SAT means a violating candidate exists. An actual unknown outcome is inconclusive.</desc><rect width="1280" height="800" fill="#081012"/>
